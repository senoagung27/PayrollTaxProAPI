spring:
  application:
    name: PayrollTax Pro API

  datasource:
    url: jdbc:postgresql://localhost:5432/payrolltax
    username: payrolluser
    password: payrollpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  # Temporarily disable Quartz - configuration needs proper setup
  # quartz:
  #   job-store-type: memory

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# JWT Configuration
jwt:
  secret: 5Z4x8K2mP9qL3vR6tY1wN7bC0dF4gHjK8mNpQrStUvWxYzA2bC5eD8fG1hI4jK7lM0nP
  expiration: 900000
  refresh-expiration: 604800000

# Payroll Configuration
payroll:
  bpjs:
    employer-percentage: 0.05
    employee-percentage: 0.02
  overtime:
    weekday-multiplier: 1.5
    weekend-multiplier: 2.0
    holiday-multiplier: 2.0
  pdf:
    template-path: classpath:templates/payslip/
  csv:
    export-path: /tmp/payroll-exports/

# Logging
logging:
  level:
    com.payrolltaxpro: DEBUG
    org.springframework.security: DEBUG
    org.springframework.batch: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/payrolltax-pro.log
    max-size: 10MB
    max-history: 30

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
